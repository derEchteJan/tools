<!DOCTYPE html>
<html>
<head>
<title>Edit File</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/main.css">
<link rel="stylesheet" href="/themes/default/default.css">
<link rel="stylesheet" href="/custom.css">
<style>
#ta_text_input
{
    height: 400pt;
    resize: none;
}
#ta_text_input, #ta_file_path
{
    width: 100%;
    color: var(--text1);
    background-color: var(--surface2);
    border: 1px solid transparent;
    border-radius: 5pt;
    outline: none;
}
#ta_text_input:focus, #ta_file_path:focus
{
    border: 1px solid var(--text3);
    outline: none;
}
#btn-save
{
    color: var(--surface1);
    background-color: var(--accent1);
}
#btn-delete
{
    color: var(--surface1);
    background-color: var(--error1);
    float: right;
    margin-right: 0;
}
table.filetable
{
    width: 100%;
    border-collapse: separate;
}
table.filetable tr
{
    background: var(--surface1);
}
table.filetable tr:nth-child(even)
{
    background: var(--surface2);
}
table.filetable td
{
    padding: 6pt 6pt 6pt 6pt;
}
h2#no-attachments
{
    color: var(--surface2);
}
</style>
</head>
<body>
<div id="sidebar" style="display:none;">
</div>
<div id="main" class="main-div">
    <div id="content" class="content-div">
        <!-- Main Page Content -->

        <h2>Edit File</h2>
        <pre>File:</pre>
        <textarea id="ta_file_path" name="path" cols="256" rows="1" placeholder="path to save" spellcheck="false"></textarea><br>
        <br>
        <button id="btn-reload">Reload</button>
        <pre>Contents:</pre>
        <textarea id="ta_text_input" name="contents" placeholder="loading file..." spellcheck="false"></textarea><br>
        <br>
        <button id="btn-overlay">Attach File</button>
        <br><br>
        <button id="btn-save">Save</button>
        <button id="btn-cancel">Cancel</button>
        <button id="btn-delete">Delete</button>
        
        <!-- Debug Features -->
        <div id="debug-features" style="display: none;">
            <br><br><br><br><br><br><br><br>
            <button id="fetch" onclick="onFetchPressed();">fetch</button>
            <button id="post" onclick="onPostPressed();">post</button><br>
            <button id="load-attachments" onclick="loadAttachments();">load attachments</button><br>
            <pre><a href="/" id="link_result">result</a></pre>
            <pre><a href="/" id="link_original">original</a></pre>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer" class="content-div">
        <hr class="separator">
        <a href="/">&lt;&lt; Zur&uuml;ck zur Startseite</a><br>
        <p>Created with markdown generator<br>Source code: <a href="https://github.com/derEchteJan/tools/tree/main/mdgen">GitHub</a></p>
    </div>
</div>
<!-- Overlay -->
<div id="overlay" class="overlay-div">
    <div id="overlay-main" class="main-div">
        <div id="overlay-content" class="content-div">
        <!-- Overlay Contents -->

            <div style="background: var(--surface3); border-radius: 4pt; padding: 5pt 5pt 5pt 5pt; margin-top: 20%">
            <h2>Attach File</h2>
            <pre>Uploaded Files:</pre>
            <div style="width: 100%; border-radius: 4pt;">
            <table class="filetable" id="attachment-table" display="none;">
                <tr style="display: none;">
                    <td>test-file-dummy.txt</td>
                    <td><a href="/"><button>View</button></a> <button>Copy</button></td>
                </tr>
            </table>
            </div>
            <h2 id="no-attachments" display="inline;">No Attachments Yet</h2>
            <pre>Upload New File</pre>
            <pre>File Name:</pre>
            <textarea id="ta_file_path" name="path" cols="256" rows="1" placeholder="name to save as.."></textarea><br>
            <pre>File:</pre>
            <form action='/.actions/upload.php' id="upload-form" method='post' enctype='multipart/form-data'>
                Select file to upload:
                <input type='file' name="fileToUpload" id="fileToUpload"><br>
            </form>
            <br>
            <button id="btn-submit-att" class="accent">Upload</button>
            </div>

        </div>
    </div>
</div>
<!-- Modal Overlay -->
<div id="modal" class="modal-div">
    <div id="modal-main" class="modal-main-div">
        <div id="modal-content" class="content-div">
        <!-- Modal Overlay Contents -->

        </div>
    </div>
</div>
<script src="/main.js" type="module"></script>
<script src="edit.js" type="module"></script>
</body>
</html>
